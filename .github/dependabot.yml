version: 2
updates:
  # Frontend npm dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Batch low-risk dev/tooling bumps into one PR to cut review noise.
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TS 7 yet ("typescript-eslint does
      # not support TS 7.0" failed lint on #50). Lift once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows above.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
